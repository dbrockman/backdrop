[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/backdrop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dbrockman/backdrop"
publish = false

[workspace.dependencies]
backdrop-core = { version = "0.1.0", path = "crates/backdrop-core" }
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
fastrand = "2"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
gpui-kit = "=0.9.0"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
toml = "1"
trash = "5"
ureq = "3"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# GPUI is slow unoptimized; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2

# CI only runs the tests, so it skips the dependency optimization above,
# which makes a cold build several times slower. A custom profile inherits
# the package overrides of the one it's based on, so reset them.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 0
