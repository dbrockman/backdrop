[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/backdrop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dbrockman/backdrop"
publish = false

[workspace.dependencies]
backdrop-core = { path = "crates/backdrop-core" }
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
gpui-kit = "=0.7.1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
toml = "1"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# GPUI is slow unoptimized; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2
