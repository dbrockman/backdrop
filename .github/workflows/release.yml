name: Release

# release-plz (configured in release-plz.toml) keeps a "Release vX.Y.Z" pull
# request up to date with the version bump and CHANGELOG.md. Merging it tags
# the merge commit and creates the GitHub release.
#
# Both jobs use a GitHub App token rather than GITHUB_TOKEN: pull requests and
# pushes made with GITHUB_TOKEN don't start other workflows, so CI would never
# run on the release PR. The app needs read & write access to Contents and
# Pull requests. Its client ID goes in the RELEASE_APP_CLIENT_ID variable and
# its private key in the RELEASE_APP_PRIVATE_KEY secret.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tags and releases the version on main if no tag for it exists yet, which
  # is the case right after the release PR is merged.
  release:
    name: Release
    if: github.repository_owner == 'dbrockman'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Opens or updates the release PR.
  release-pr:
    name: Release PR
    if: github.repository_owner == 'dbrockman'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Queue rather than cancel, so two runs never edit the release PR at once.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
